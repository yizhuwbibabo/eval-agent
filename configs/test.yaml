# Test evaluation config - fast, deterministic, offline.
evaluation:
  dataset: agent_behavior_v1
  dataset_version: v1
  mode: decision_point
  trials_per_instance: 1

models:
  - id: model_a
    provider_model: mock/compliant
    provider: mock
  - id: model_b
    provider_model: mock/error_prone
    provider: mock

generation:
  temperature: 0
  max_output_tokens: 4096

execution:
  concurrency: 2
  timeout_seconds: 30
  retry_attempts: 1
  retry_backoff_base: 0.01

grading:
  strategy: hybrid
  pass_threshold: 4.0
  judge: mock
  judge_version: v1
