# DeepSeek (official) real-model config for the real recovery benchmark.
#
# Model under test: DeepSeek deepseek-flash (openai_compat, thinking off).
# Judge: Zhipu GLM-5 (real LLM rubric judge).
#
# Requires:
#   export OPENAI_API_KEY=sk-...                     # DeepSeek key (model under test)
#   export OPENAI_BASE_URL=https://api.deepseek.com  # official DeepSeek endpoint
#   export JUDGE_API_KEY=...                          # Zhipu GLM key (judge)
#   export AGENTEVALOPS_ALLOW_EXTERNAL_RAW_TRACES=true  # opt in to external sends
#
# The dataset is the public GurkanOz/tool-failure-recovery-trajectories set;
# email-domain (PII-shaped) records are already quarantined by the quality gate.
#
# Do NOT commit real keys.
evaluation:
  dataset: recovery_v3
  dataset_version: v1
  mode: decision_point
  trials_per_instance: 1

models:
  - id: model_deepseek_flash
    provider_model: openai/deepseek-flash
    provider: openai_compat
    config:
      thinking:
        type: disabled

generation:
  temperature: 0
  max_output_tokens: 4096

execution:
  concurrency: 8
  timeout_seconds: 120
  retry_attempts: 3
  retry_backoff_base: 2.0

grading:
  strategy: hybrid
  pass_threshold: 4.0
  judge: llm
  judge_version: v1
  judge_model: glm-5
  judge_base_url: https://open.bigmodel.cn/api/paas/v4
  concurrency: 2
  judge_config:
    thinking:
      type: disabled
    max_tokens: 1024
