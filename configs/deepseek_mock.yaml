# DeepSeek model-under-test with the offline (mock) rubric judge.
# Fast path: run the model now, re-score with a real judge later.
#
# Requires OPENAI_API_KEY / OPENAI_BASE_URL / AGENTEVALOPS_ALLOW_EXTERNAL_RAW_TRACES=true.
evaluation:
  dataset: recovery_v3
  dataset_version: v1
  mode: decision_point
  trials_per_instance: 1

models:
  - id: model_deepseek_flash
    provider_model: openai/deepseek-flash
    provider: openai_compat
    config:
      thinking:
        type: disabled

generation:
  temperature: 0
  max_output_tokens: 4096

execution:
  concurrency: 8
  timeout_seconds: 120
  retry_attempts: 3
  retry_backoff_base: 2.0

grading:
  strategy: hybrid
  pass_threshold: 4.0
  judge: mock
  judge_version: v1
