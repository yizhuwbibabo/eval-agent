name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentevalops
          POSTGRES_PASSWORD: agentevalops
          POSTGRES_DB: agentevalops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentevalops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTEVALOPS_TEST_POSTGRES_URL: postgresql+psycopg://agentevalops:agentevalops@localhost:5432/agentevalops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Typecheck
        run: mypy src --follow-imports=skip
      - name: Test (with coverage)
        run: pytest -q --cov=agentevalops --cov-fail-under=78
      - name: E2E
        run: |
          python scripts/generate_synthetic_traces.py
          python scripts/run_e2e.py --config configs/development.yaml
